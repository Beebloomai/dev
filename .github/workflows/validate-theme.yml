
name: XML Theme Validation

on:
  push:
    paths:
      - 'themes/**.xml'
  pull_request:
    paths:
      - 'themes/**.xml'

jobs:
  validate-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Run XML Validation
        run: |
          python scripts/validate/validate_xml.py themes/breakup-and-bloom.xml
