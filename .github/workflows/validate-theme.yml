name: Validate and Format Blogger Theme

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-theme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.x
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install lxml beautifulsoup4

    - name: Format and validate XML theme
      run: |
        # Format XML using xmllint
        sudo apt-get install -y libxml2-utils
        xmllint --format themes/breakup-and-bloom.xml -o themes/breakup-and-bloom-formatted.xml
        
        # Run custom python validation script (you will create this)
        python scripts/validate_theme.py --file themes/breakup-and-bloom-formatted.xml

    - name: Lint CSS files
      run: |
        npm install -g stylelint stylelint-config-standard
        stylelint "assets/css/**/*.css"

    - name: Lint JS files
      run: |
        npm install -g eslint
        eslint assets/js/**/*.js

    - name: Commit formatted files if changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add themes/breakup-and-bloom-formatted.xml
        git diff --cached --quiet || git commit -m "chore: auto-format XML theme"
        git push || echo "No changes to commit"
